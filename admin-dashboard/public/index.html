<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arvon - Admin Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0e11;
      color: #f2f5f6;
    }

    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0e11 0%, #1a2332 100%);
    }

    .login-card {
      background: #0f1213;
      border: 1px solid #22282b;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .login-card h1 {
      font-size: 28px;
      margin-bottom: 30px;
      text-align: center;
      color: #17b8d1;
    }

    .login-card label {
      display: block;
      margin-bottom: 8px;
      color: #8a9598;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .login-card input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      background: #1a1f23;
      border: 1px solid #22282b;
      border-radius: 6px;
      color: #f2f5f6;
      font-size: 14px;
    }

    .login-card input:focus {
      outline: none;
      border-color: #17b8d1;
      background: #202730;
    }

    .login-card button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #17b8d1 0%, #0fa5b8 100%);
      border: none;
      border-radius: 6px;
      color: #000;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .login-card button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(23, 184, 209, 0.2);
    }

    .dashboard {
      display: none;
      min-height: 100vh;
      background: #0a0e11;
    }

    .dashboard.active {
      display: flex;
    }

    .sidebar {
      width: 280px;
      background: #0f1213;
      border-right: 1px solid #22282b;
      padding: 20px;
      overflow-y: auto;
      height: 100vh;
    }

    .sidebar h2 {
      font-size: 20px;
      margin-bottom: 30px;
      color: #17b8d1;
    }

    .sidebar-menu {
      list-style: none;
    }

    .sidebar-menu li {
      margin-bottom: 10px;
    }

    .sidebar-menu button {
      width: 100%;
      padding: 12px;
      background: #1a1f23;
      border: 1px solid #22282b;
      border-radius: 6px;
      color: #8a9598;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      font-size: 14px;
    }

    .sidebar-menu button:hover {
      background: #22282b;
      color: #17b8d1;
    }

    .sidebar-menu button.active {
      background: #17b8d1;
      color: #000;
      font-weight: 600;
    }

    .sidebar-logout {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #22282b;
    }

    .sidebar-logout button {
      width: 100%;
      padding: 12px;
      background: #ff4d6d;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .sidebar-logout button:hover {
      background: #ff3852;
    }

    .main-content {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
      height: 100vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid #22282b;
    }

    .header h1 {
      font-size: 28px;
      color: #f2f5f6;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: #0f1213;
      border: 1px solid #22282b;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }

    .stat-card h3 {
      color: #8a9598;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .stat-card .value {
      font-size: 32px;
      font-weight: 700;
      color: #17b8d1;
    }

    .tournaments-section {
      display: none;
    }

    .tournaments-section.active {
      display: block;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-header h2 {
      font-size: 20px;
      color: #f2f5f6;
    }

    .btn {
      padding: 10px 16px;
      background: #17b8d1;
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 13px;
    }

    .btn:hover {
      background: #0fa5b8;
      transform: translateY(-2px);
    }

    .tournaments-list {
      background: #0f1213;
      border: 1px solid #22282b;
      border-radius: 8px;
      overflow: hidden;
    }

    .tournament-item {
      padding: 20px;
      border-bottom: 1px solid #22282b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tournament-item:last-child {
      border-bottom: none;
    }

    .tournament-info h3 {
      color: #f2f5f6;
      font-size: 15px;
      margin-bottom: 8px;
    }

    .tournament-info p {
      color: #8a9598;
      font-size: 13px;
    }

    .tournament-actions {
      display: flex;
      gap: 8px;
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 12px;
      background: #22282b;
      color: #17b8d1;
      border: 1px solid #17b8d1;
    }

    .btn-small:hover {
      background: #17b8d1;
      color: #000;
    }

    .btn-delete {
      border-color: #ff4d6d;
      color: #ff4d6d;
    }

    .btn-delete:hover {
      background: #ff4d6d;
      color: white;
    }

    .create-form {
      background: #0f1213;
      border: 1px solid #22282b;
      border-radius: 8px;
      padding: 30px;
      margin-bottom: 30px;
      display: none;
    }

    .create-form.active {
      display: block;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #8a9598;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      background: #1a1f23;
      border: 1px solid #22282b;
      border-radius: 6px;
      color: #f2f5f6;
      font-size: 14px;
      font-family: inherit;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #17b8d1;
      background: #202730;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .btn-cancel {
      background: #22282b;
      color: #8a9598;
    }

    .btn-cancel:hover {
      background: #2a3035;
      color: #f2f5f6;
    }

    .empty-state {
      text-align: center;
      color: #8a9598;
      padding: 40px;
    }

    .empty-state p {
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="loginContainer" class="login-container">
    <div class="login-card">
      <h1>🔐 Admin Dashboard</h1>
      <label>Mot de passe</label>
      <input type="password" id="passwordInput" placeholder="Entrez le mot de passe" />
      <button onclick="adminLogin()">Se connecter</button>
    </div>
  </div>

  <div id="dashboardContainer" class="dashboard">
    <div class="sidebar">
      <h2>Arvon Admin</h2>
      <ul class="sidebar-menu">
        <li><button class="nav-btn active" onclick="switchSection('dashboard')">Dashboard</button></li>
        <li><button class="nav-btn" onclick="switchSection('tournaments')">Tournois</button></li>
      </ul>
      <div class="sidebar-logout">
        <button onclick="adminLogout()">Déconnexion</button>
      </div>
    </div>

    <div class="main-content">
      <!-- Dashboard Section -->
      <div id="dashboardSection" class="tournaments-section active">
        <div class="header">
          <h1>Dashboard</h1>
        </div>
        <div class="stats-grid">
          <div class="stat-card">
            <h3>Total Tournois</h3>
            <div class="value" id="statTourneys">0</div>
          </div>
          <div class="stat-card">
            <h3>Actifs</h3>
            <div class="value" id="statActive">0</div>
          </div>
          <div class="stat-card">
            <h3>Utilisateurs</h3>
            <div class="value" id="statUsers">0</div>
          </div>
        </div>
      </div>

      <!-- Tournaments Section -->
      <div id="tournamentsSection" class="tournaments-section">
        <div class="section-header">
          <h2>Gestion des Tournois</h2>
          <button class="btn" onclick="toggleCreateForm()">+ Nouveau Tournoi</button>
        </div>

        <div id="createForm" class="create-form">
          <h3 style="margin-bottom: 20px; color: #f2f5f6;">Créer un nouveau tournoi</h3>
          <div class="form-group">
            <label>Nom du tournoi</label>
            <input type="text" id="tourneyName" placeholder="ex: Spring Championship" />
          </div>
          <div class="form-group">
            <label>Mode de jeu</label>
            <select id="tourneyMode">
              <option value="1v1">1v1 Duel</option>
              <option value="2v2">2v2 Team</option>
              <option value="3v3">3v3 Team</option>
              <option value="br">Battle Royale</option>
            </select>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="tourneyDesc" placeholder="Détails et règles du tournoi..."></textarea>
          </div>
          <div class="form-group">
            <label>Max Participants</label>
            <input type="number" id="tourneyMax" placeholder="16" value="16" />
          </div>
          <div class="form-group">
            <label>Prize Pool (USD)</label>
            <input type="number" id="tourneyPrize" placeholder="10000" value="10000" />
          </div>
          <div class="form-group">
            <label>Date de début</label>
            <input type="date" id="tourneyDate" />
          </div>
          <div class="form-actions">
            <button class="btn btn-cancel" onclick="toggleCreateForm()">Annuler</button>
            <button class="btn" onclick="createTournament()">Créer</button>
          </div>
        </div>

        <div class="tournaments-list" id="tournamentsList">
          <div class="empty-state">
            <p>Aucun tournoi créé pour le moment</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
